[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "futures-intraday-model-v2"
version = "0.1.0"
description = "Deterministic, causal futures research foundation"
requires-python = "==3.11.9"
dependencies = ["numpy==2.4.4", "PyYAML==6.0.3"]

[project.optional-dependencies]
test = ["pytest==9.0.3"]
vault = ["databento==0.78.0"]
cockpit = [
    "databento==0.78.0",
    "pandas==3.0.3",
    "pywebview==6.2.1",
]
package = ["PyInstaller==6.21.0"]
calendar-docs = ["pypdf==6.14.2"]

[project.scripts]
futures-dbn-catalog = "futures_rebuild.dbn_catalog:main"
futures-readiness = "futures_rebuild.readiness:main"
futures-pipeline = "futures_rebuild.pipeline:main"
futures-retirement-audit = "futures_rebuild.retirement:main"
futures-high-risk-prepare = "futures_rebuild.high_risk:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "current: ordinary fast local-development coverage",
    "high_risk: confirmation-bound safety contracts",
    "legacy: retained historic workflow compatibility",
]
